package: nginx
archive: nginx

essential:
  - nginx_copyright

slices:
  bins:
    essential:
      - libc6_libs
      - libcrypt1_libs
      - libpcre2-8-0_libs
      - libssl3t64_libs
      - zlib1g_libs
      - base-files_var
    contents:
      /usr/sbin/nginx:
      /usr/share/nginx/html/:
      /usr/lib/nginx/modules/:
      /etc/nginx/*:
      /var/log/nginx/:

  copyright:
    contents:
      /usr/share/doc/nginx/copyright:
